<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading your data...</p>
    </div>

    <!-- Auth Screen -->
    <div id="authScreen" class="auth-screen" style="display: none;">
        <div class="auth-card">
            <h1>Health Tracker</h1>
            <p>Sign in to access your data from anywhere</p>
            <button id="googleSignInBtn" class="btn auth-btn">
                <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Sign in with Google
            </button>
            <p class="auth-note">Your data will be securely stored in the cloud</p>
        </div>
    </div>

    <div id="mainApp" class="container" style="display: none;">
        <header>
            <div class="header-content">
                <h1>Personal Health Tracker</h1>
                <div class="user-info">
                    <span id="userEmail"></span>
                    <button id="signOutBtn" class="btn-small">Sign Out</button>
                </div>
            </div>
        </header>

        <div class="tracker-section">
            <div class="card">
                <h2>Weight Tracker</h2>
                <form id="weightForm">
                    <div class="form-group">
                        <label for="weightDate">Date:</label>
                        <input type="date" id="weightDate" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg):</label>
                        <input type="number" id="weight" step="0.1" required>
                    </div>
                    <button type="submit" class="btn">Add Weight</button>
                </form>

                <div class="chart-container">
                    <canvas id="weightChart"></canvas>
                </div>

                <div class="data-list">
                    <h3>Weight History</h3>
                    <div id="weightList"></div>
                </div>
            </div>

            <div class="card">
                <h2>Calorie Tracker</h2>
                <form id="calorieForm">
                    <div class="form-group">
                        <label for="calorieDate">Date:</label>
                        <input type="date" id="calorieDate" required>
                    </div>
                    <div class="form-group">
                        <label for="calories">Calories:</label>
                        <input type="number" id="calories" required>
                    </div>
                    <div class="form-group">
                        <label for="mealNote">Note (optional):</label>
                        <input type="text" id="mealNote" placeholder="e.g., Breakfast, Lunch">
                    </div>
                    <button type="submit" class="btn">Add Calories</button>
                </form>

                <div class="stats">
                    <div class="stat-card">
                        <h3>Total Calories (All Time)</h3>
                        <div id="totalCalories" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Today's Calories</h3>
                        <div id="todayCalories" class="stat-value">0</div>
                    </div>
                </div>

                <div class="data-list">
                    <h3>Calorie History</h3>
                    <div id="calorieList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        // Firebase configuration will be added here
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set, push, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // TODO: Replace with your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDGYyFZhW8lCoAj5ee0Ry_r6PVk4dhaLHM",
            authDomain: "health-tracker-5ab33.firebaseapp.com",
            databaseURL: "https://health-tracker-5ab33-default-rtdb.firebaseio.com",
            projectId: "health-tracker-5ab33",
            storageBucket: "health-tracker-5ab33.firebasestorage.app",
            messagingSenderId: "488368725995",
            appId: "1:488368725995:web:4af7a05ff3c6449ddcc3ae"
        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // Make Firebase available globally
        window.firebaseAuth = auth;
        window.firebaseDatabase = database;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebasePush = push;
        window.firebaseRemove = remove;
        window.firebaseOnValue = onValue;
        window.googleProvider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
    </script>
    <script src="app.js"></script>
</body>
</html>
